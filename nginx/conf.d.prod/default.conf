resolver 127.0.0.11 valid=10s;

# --------------------------------------------------
# Frontend (Site Web)
# --------------------------------------------------
server {
    listen 80;
    server_name www.jm-courtois.com jm-courtois.com www.jm-courtois.fr jm-courtois.fr jm-courtois.obelix;

    location / {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}

# --------------------------------------------------
# CMS Strapi (Administration)
# --------------------------------------------------
server {
    listen 80;
    server_name cms.jm-courtois.com;

    client_max_body_size 100M;

    location / {
        set $upstream http://cms:1337;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
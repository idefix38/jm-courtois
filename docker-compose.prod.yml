services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Le proxy déjà en place sur le serveur (ports 80/443 + certbot) route vers ce port loopback
    ports:
      - "0.0.0.0:${NGINX_PROD_PORT:-8095}:80"
    volumes:
      - ./nginx/conf.d.prod:/etc/nginx/conf.d:ro
    depends_on:
      - cms
      - frontend
    networks:
      - app_network

  cms:
    image: ghcr.io/${GHCR_OWNER:-idefix38}/jm-courtois-cms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./cms/.env.production
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      # Pas de valeur par défaut : échoue au démarrage plutôt que de retomber silencieusement sur des identifiants faibles
      - DATABASE_NAME=${POSTGRES_DB:?POSTGRES_DB manquant (voir .env.production)}
      - DATABASE_USERNAME=${POSTGRES_USER:?POSTGRES_USER manquant (voir .env.production)}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (voir .env.production)}
    volumes:
      - cms-uploads:/usr/app/public/uploads
    depends_on:
      - postgres
    networks:
      - app_network
      - postgres-network

  frontend:
    image: ghcr.io/${GHCR_OWNER:-idefix38}/jm-courtois-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./frontend/.env.production
    depends_on:
      - cms
    networks:
      - app_network

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.production
    # Bind loopback-only : accès via tunnel SSH (`ssh -L 5432:127.0.0.1:5432 ...`), jamais exposé sur le LAN directement
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - postgres-network

volumes:
  postgres-prod-data:
  cms-uploads:

networks:
  app_network:
    driver: bridge
  postgres-network:
    driver: bridge
